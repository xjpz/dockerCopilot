name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend code
        uses: actions/checkout@v3
        with:
          repository: dongshull/Docker-Copilot-React
          path: './frontend'
          ref: 'master'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/package.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Upload Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-front-dist
          path: frontend/dist

  build-binaries:
    needs: [ build-frontend ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-front-dist
          path: front

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23.4'

      - name: Build for ${{ matrix.arch }}
        run: |
          mkdir -p release
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -a --trimpath \
            -ldflags="-w -s -X 'github.com/onlyLTY/dockerCopilot/internal/config.Version=${{ env.version }}' -X 'github.com/onlyLTY/dockerCopilot/internal/config.BuildDate=$(date)'" \
            -o release/dockerCopilot-${{ matrix.arch }} .

      - name: Package ${{ matrix.arch }}
        run: cd release && tar -czf dockerCopilot-${{ matrix.arch }}.tar.gz dockerCopilot-${{ matrix.arch }} && rm dockerCopilot-${{ matrix.arch }}

      - name: Upload ${{ matrix.arch }} binary
        uses: actions/upload-artifact@v4
        with:
          name: release-binary-${{ matrix.arch }}
          path: release/dockerCopilot-${{ matrix.arch }}.tar.gz

      - name: Upload ${{ matrix.arch }} docker binary
        uses: actions/upload-artifact@v4
        with:
          name: release-docker-binary-${{ matrix.arch }}
          path: release/dockerCopilot-${{ matrix.arch }}

  build-docker:
    needs: [ build-binaries ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-front-dist
          path: front

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: release-docker-binary-amd64
          path: release

      - name: Download arm64 binary
        uses: actions/download-artifact@4
        with:
          name: release-docker-binary-arm64
          path: release

      - name: Prepare build context
        run: |
          mkdir -p dc-back/dist/linux/amd64 dc-back/dist/linux/arm64
          cp release/dockerCopilot-amd64 dc-back/dist/linux/amd64/dockerCopilot
          cp release/dockerCopilot-arm64 dc-back/dist/linux/arm64/dockerCopilot
          cp -r etc dc-back/etc
          cp start.sh dc-back/start.sh
          rm -rf release

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dockercopilot:${{ env.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dockercopilot:latest
          push: true

  create-release:
    needs: [ build-binaries ]
    runs-on: ubuntu-latest
    steps:
      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: release-binary-amd64
          path: release

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: release-binary-arm64
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            release/dockerCopilot-amd64.tar.gz
            release/dockerCopilot-arm64.tar.gz
          generate_release_notes: true
